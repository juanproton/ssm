<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SERIE 4 — Juan Pedro Vallejo</title>

<link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">

<style>
body {
  margin: 0;
  font-family: Helvetica, sans-serif;
  color: black;
  background: white;
}

/* ─── NAV (IMPORTANT) ───────────────── */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  z-index: 100;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-right {
  display: flex;
  align-items: center;
}

nav a,
.brand {
  color: black;
  text-decoration: none;
  cursor: pointer;
}

/* DROPDOWN */
.dropdown {
  position: relative;
}

.dropdown-content {
  position: absolute;
  top: 40px;
  left: 0;
  background: white;
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 10px;
  min-width: 220px;
  z-index: 30;
}

.dropdown-content a {
  padding: 6px 8px;
}

.dropdown-content a:hover {
  background: black;
  color: white;
}

/* BREVO */
.sib-form,
#sib-form-container,
#sib-container {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
  margin: 0 !important;
}

#sib-form {
  display: flex;
  gap: 10px;
  align-items: center;
}

#sib-container input {
  width: 180px;
  border: none;
  border-bottom: 1px solid black;
  background: transparent;
  padding: 4px 0;
}

#sib-form button {
  background: black !important;
  color: white !important;
  border: none;
  padding: 6px 12px;
  cursor: pointer;
}

/* ─── CONTENT ───────────────────────── */
main {
  padding-top: 120px;
  width: calc(100% - 80px);
  max-width: 1100px;
  margin: auto;
}

h1 {
  font-size: 32px;
  font-weight: normal;
  margin-bottom: 20px;
}

.description {
  max-width: 720px;
  line-height: 1.5;
  margin-bottom: 40px;
}

/* MOSAIC (2 columns) */
#mosaic {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  align-items: start;
  margin-bottom: 60px;
}

#mosaic img {
  width: 100%;
  height: auto;
  display: block;
}

/* SKETCH (below the images) */
#sketch-container {
  width: 100%;
  margin-bottom: 80px;
}

#sketch-container canvas {
  display: block;
  max-width: 100%;
  height: auto !important;
  margin: 0 auto;
}

/* MOBILE */
@media (max-width: 800px) {
  main {
    width: calc(100% - 30px);
  }

  #sib-container input {
    width: 110px;
  }

  #mosaic {
    gap: 8px;
  }
}
</style>
</head>

<body>

<div id="header"></div>

<main>

<h1>SERIE 4</h1>

<div class="description">
This body of work explores the organization of the figure within a simple grid, seeking to generate new relationships through repetition and variation, suggesting a sense of progression and implicit movement.
</div>

<div id="mosaic"></div>

<div id="sketch-container"></div>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* LOAD HEADER */
  fetch("./header.html?" + Date.now())
  .then(response => response.text())
  .then(data => {
    document.getElementById("header").innerHTML = data

    window.toggleMenu = function() {
      const menu = document.getElementById("work-menu")

      menu.style.display =
        menu.style.display === "flex"
        ? "none"
        : "flex"
    }

    document.addEventListener("click", (e) => {
      const dropdown = document.querySelector(".dropdown")
      const menu = document.getElementById("work-menu")

      if (dropdown && !dropdown.contains(e.target)) {
        menu.style.display = "none"
      }
    })
  })

  /* MOSAIC: serie4_1.png ... serie4_8.png (missing files are skipped) */
  const mosaic = document.getElementById("mosaic")
  const MAX_IMAGES = 8

  for (let i = 1; i <= MAX_IMAGES; i++) {
    const img = new Image()
    img.alt = "Serie 4 — " + i
    img.onerror = () => img.remove() /* file doesn't exist: skip it */
    img.src = "serie4_" + i + ".png"
    mosaic.appendChild(img)
  }

})

/* SKETCH: move the p5 canvas into #sketch-container, below the images */
window.addEventListener("load", () => {
  const container = document.getElementById("sketch-container")

  const place = () => {
    const c = document.querySelector("canvas.p5Canvas") || document.querySelector("body > canvas")
    if (c && c.parentElement !== container) {
      container.appendChild(c)
      return true
    }
    return !!c
  }

  if (!place()) {
    const obs = new MutationObserver(() => { if (place()) obs.disconnect() })
    obs.observe(document.body, { childList: true, subtree: true })
  }
})
</script>

<!-- p5.js + the sketch -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="interfseq.js"></script>

<script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>

</body>
</html>
