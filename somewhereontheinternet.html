<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SERIE 4 — Juan Pedro Vallejo</title>

<link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">

<style>
body {
  margin: 0;
  font-family: Helvetica, sans-serif;
  color: black;
  background: white;
}

/* ─── NAV (IMPORTANT) ───────────────── */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  z-index: 100;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-right {
  display: flex;
  align-items: center;
}

nav a,
.brand {
  color: black;
  text-decoration: none;
  cursor: pointer;
}

/* DROPDOWN */
.dropdown {
  position: relative;
}

.dropdown-content {
  position: absolute;
  top: 40px;
  left: 0;
  background: white;
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 10px;
  min-width: 220px;
  z-index: 30;
}

.dropdown-content a {
  padding: 6px 8px;
}

.dropdown-content a:hover {
  background: black;
  color: white;
}

/* BREVO */
.sib-form,
#sib-form-container,
#sib-container {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
  margin: 0 !important;
}

#sib-form {
  display: flex;
  gap: 10px;
  align-items: center;
}

#sib-container input {
  width: 180px;
  border: none;
  border-bottom: 1px solid black;
  background: transparent;
  padding: 4px 0;
}

#sib-form button {
  background: black !important;
  color: white !important;
  border: none;
  padding: 6px 12px;
  cursor: pointer;
}

/* ─── CONTENT ───────────────────────── */
main {
  padding-top: 120px;
  width: calc(100% - 80px);
  max-width: 1100px;
  margin: auto;
}

h1 {
  font-size: 32px;
  font-weight: normal;
  margin-bottom: 20px;
}

.description {
  max-width: 720px;
  line-height: 1.5;
  margin-bottom: 40px;
}

/* MOSAIC (2 columns) */
#mosaic {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  align-items: start;
  margin-bottom: 60px;
}

#mosaic img {
  width: 100%;
  height: auto;
  display: block;
}

#mosaic {
  position: relative;
  z-index: 2;
}

#mosaic img {
  cursor: zoom-in;
}

/* LIGHTBOX (full screen presentation mode) */
#lightbox {
  position: fixed;
  inset: 0;
  background: white;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
}

#lightbox.open {
  display: flex;
}

#lightbox img {
  max-width: calc(100% - 160px);
  max-height: calc(100% - 100px);
  object-fit: contain;
  display: block;
  cursor: default;
}

#lightbox button {
  position: absolute;
  background: none;
  border: none;
  color: black;
  font-family: Helvetica, sans-serif;
  cursor: pointer;
  padding: 16px;
  line-height: 1;
}

#lb-prev,
#lb-next {
  top: 50%;
  transform: translateY(-50%);
  font-size: 44px;
}

#lb-prev { left: 10px; }
#lb-next { right: 10px; }

#lb-close {
  top: 10px;
  right: 14px;
  font-size: 36px;
}

#lb-count {
  position: absolute;
  bottom: 18px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 14px;
}

#lightbox button:hover {
  opacity: 0.5;
}

@media (max-width: 800px) {
  #lightbox img {
    max-width: calc(100% - 20px);
    max-height: calc(100% - 120px);
  }

  #lb-prev,
  #lb-next {
    top: auto;
    bottom: 4px;
    transform: none;
    font-size: 36px;
  }

  #lb-prev { left: 10px; }
  #lb-next { right: 10px; }
}

/* SKETCH (below the images) */
#sketch-container {
  position: relative;
  width: 100%;
  margin-bottom: 80px;
  text-align: center;
  clear: both;
}

#sketch-container canvas {
  position: static !important;
  display: block !important;
  max-width: 100%;
  height: auto !important;
  margin: 0 auto !important;
  left: auto !important;
  top: auto !important;
}

/* MOBILE */
@media (max-width: 800px) {
  main {
    width: calc(100% - 30px);
  }

  #sib-container input {
    width: 110px;
  }

  /* phone: one image per row (desktop keeps 2 columns) */
  #mosaic {
    grid-template-columns: 1fr;
    gap: 12px;
  }
}
</style>
</head>

<body>

<div id="header"></div>

<main>

<h1>SERIE 4</h1>

<div class="description">
This body of work explores the organization of the figure within a simple grid, seeking to generate new relationships through repetition and variation, suggesting a sense of progression and implicit movement.
Generative serie. Medium: pen plotter. Open serie. 25cm x 25cm
</div>

<div id="mosaic"></div>

<div id="sketch-container">
  <canvas id="canvasId"></canvas>
</div>

</main>

<!-- LIGHTBOX -->
<div id="lightbox" aria-hidden="true">
  <button id="lb-close" aria-label="Close">&times;</button>
  <button id="lb-prev" aria-label="Previous">&#8249;</button>
  <img id="lb-img" alt="" />
  <button id="lb-next" aria-label="Next">&#8250;</button>
  <div id="lb-count"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* LOAD HEADER */
  fetch("./header.html?" + Date.now())
  .then(response => response.text())
  .then(data => {
    document.getElementById("header").innerHTML = data

    window.toggleMenu = function() {
      const menu = document.getElementById("work-menu")

      menu.style.display =
        menu.style.display === "flex"
        ? "none"
        : "flex"
    }

    document.addEventListener("click", (e) => {
      const dropdown = document.querySelector(".dropdown")
      const menu = document.getElementById("work-menu")

      if (dropdown && !dropdown.contains(e.target)) {
        menu.style.display = "none"
      }
    })
  })

  /* MOSAIC: serie4_1.png ... serie4_8.png (missing files are skipped) */
  const mosaic = document.getElementById("mosaic")
  const MAX_IMAGES = 10

  for (let i = 1; i <= MAX_IMAGES; i++) {
    const img = new Image()
    img.alt = "Serie 4 — " + i
    img.onerror = () => img.remove() /* file doesn't exist: skip it */
    img.src = "serie4_" + i + ".png"
    mosaic.appendChild(img)
  }

});

/* LIGHTBOX */
;(function () {
  const mosaic = document.getElementById("mosaic")
  const box = document.getElementById("lightbox")
  const big = document.getElementById("lb-img")
  const count = document.getElementById("lb-count")
  let index = 0

  const imgs = () => Array.from(mosaic.querySelectorAll("img"))

  function show(i) {
    const list = imgs()
    if (!list.length) return
    index = (i + list.length) % list.length
    big.src = list[index].src
    count.textContent = (index + 1) + " / " + list.length
  }

  function open(i) {
    show(i)
    box.classList.add("open")
    box.setAttribute("aria-hidden", "false")
    document.body.style.overflow = "hidden"
  }

  function close() {
    box.classList.remove("open")
    box.setAttribute("aria-hidden", "true")
    document.body.style.overflow = ""
  }

  /* capture phase on document: works even if the sketch or other scripts intercept clicks */
  document.addEventListener("click", (e) => {
    const img = e.target.closest ? e.target.closest("#mosaic img") : null
    if (img) open(imgs().indexOf(img))
  }, true)

  document.getElementById("lb-prev").addEventListener("click", (e) => { e.stopPropagation(); show(index - 1) })
  document.getElementById("lb-next").addEventListener("click", (e) => { e.stopPropagation(); show(index + 1) })
  document.getElementById("lb-close").addEventListener("click", close)

  /* click on the empty background closes it */
  box.addEventListener("click", (e) => { if (e.target === box) close() })

  /* keyboard */
  document.addEventListener("keydown", (e) => {
    if (!box.classList.contains("open")) return
    if (e.key === "Escape") close()
    if (e.key === "ArrowLeft") show(index - 1)
    if (e.key === "ArrowRight") show(index + 1)
  })

  /* swipe on touch screens */
  let startX = null
  box.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX }, { passive: true })
  box.addEventListener("touchend", (e) => {
    if (startX === null) return
    const dx = e.changedTouches[0].clientX - startX
    if (Math.abs(dx) > 50) show(dx < 0 ? index + 1 : index - 1)
    startX = null
  })
})()
</script>

<!-- paper.js + the sketch -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-core.min.js"></script>
<script src="somewhere.js"></script>

<script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>

</body>
</html>
