<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  margin: 0;
  font-family: Helvetica, sans-serif;
  color: black;
  background: white;
}

/* SKETCH (centered in the browser window) */
html,
body {
  height: 100%;
  overflow: hidden;
}

#sketch-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  z-index: 1;

  /* center the canvas, whatever size the sketch gives it */
  display: flex;
  align-items: center;
  justify-content: center;
}

/* no width / height here: the sketch sets the size of the canvas
   (canvas.width / canvas.height) and paper.js reads it, so it must not be
   stretched by CSS */
#sketch-container canvas {
  display: block;
  flex: none;
}
</style>
</head>

<body>

<div id="sketch-container">
  <canvas id="canvasId"></canvas>
</div>

<!-- paper.js + the sketch -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-core.min.js"></script>
<script src="setupFunctions.js"></script>
<script src="somewhere.js"></script>

</body>
</html>
