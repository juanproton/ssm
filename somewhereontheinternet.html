<style>
body {
  margin: 0;
  font-family: Helvetica, sans-serif;
  color: black;
  background: white;
}

/* ─── NAV (IMPORTANT) ───────────────── */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  z-index: 100;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-right {
  display: flex;
  align-items: center;
}

nav a,
.brand {
  color: black;
  text-decoration: none;
  cursor: pointer;
}

/* SKETCH (full browser window, behind the header) */
html,
body {
  height: 100%;
  overflow: hidden;
}

#sketch-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  z-index: 1;
}

#sketch-container canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/* MOBILE */
@media (max-width: 800px) {
  #sib-container input {
    width: 110px;
  }
}
</style>
</head>

<body>

<div id="header"></div>

<div id="sketch-container">
  <canvas id="canvasId"></canvas>
</div>
